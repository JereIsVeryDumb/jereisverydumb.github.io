<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Rapid Development Portfolio - Jere Storlöpare </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Project Showcase</h1>
        <p> Showcase of all the work I did over the summer </p>
    </header>

    <main class="gallery">

        <!-- Project 1: Jere's Speedsters' -->
        <article class="project-card">
            <h2>Jere's Speedsters</h2>
            <p> Jere's Speedsters is a top-down racing game that was made on Godot 4.5. On top of Godot I also used Piskel for the graphics.</p>

            <!-- Video Demo (YouTube Embed) -->
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID"
                        title="Project 1 Demo"
                        allowfullscreen>
                </iframe>
            </div>

            <!-- Image Showcase -->
            <div class="image-grid">
                <img src="assets/images/jeres_speedsters_main.png" alt="The main menu of the game">
            </div>
        </article>

        <!-- Project 2: Direct Video Loop -->
        <article class="project-card">
            <h2>Project Two Title</h2>
            <p>Short description highlighting key features.</p>

            <!-- Direct HTML5 Video (For small clips) -->
            <div class="video-container">
                <video controls autoplay loop muted playsinline>
                    <source src="assets/videos/project1-clip.webm" type="video/webm">
                    Your browser does not support the video tag.
                </video>
            </div>
        </article>

    </main>

</body>
</html>
